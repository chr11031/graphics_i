<html style="font-family: 'Roboto', sans-serif;">
	<head>
		<title>Demo: Cook-Torrance BRDF</title>
		<style>
			table {border: 0px solid;}
		</style>
		
		<script type="text/javascript" src="/js/Types/RGBA.js"></script>
		<script type="text/javascript" src="/js/Types/Vec2.js"></script>
		<script type="text/javascript" src="/js/Types/Vec3.js"></script>
		<script type="text/javascript" src="/js/Types/Vec4.js"></script>
		<script type="text/javascript" src="/js/Types/Matrix4x4.js"></script>
		
		<script type="text/javascript" src="/js/Helpers/Framebuffer.js"></script>
		<script type="text/javascript" src="/js/Helpers/Texture.js"></script>
		<script type="text/javascript" src="/js/Helpers/Shader.js"></script>

		<script type="text/javascript" src="/js/Loaders/Resource_Loader.js"></script>
		<script type="text/javascript" src="/js/Cameras/Orbit_Camera.js"></script>
		<script type="text/javascript" src="/js/Data_Structures/Drawable.js"></script>
		<script type="text/javascript" src="/js/Effects/Cook_Torrance_BRDF.js"></script>
		
		<script>
		
			// GLOBALS to be read/called from any JS file
			var resources = null;
			var gl = null;


			// LOCAL state (View)
			var model_selected = null;
			var mouse_last_x = null;
			var mouse_last_y = null;
			var user_camera = null;


			// LOCAL state (GL)
			var cook_torrance_brdf = null;
			var drawables = [];

			
			function update_selection(e)
			{
				var el = document.getElementById("model_chosen");
				if (el.value == "cabinet")
				{
					model_selected = 0;
				}
				else if (el.value == "food")
				{
					model_selected = 1;
				}
				else if (el.value == "jug")
				{
					model_selected = 2;
				}
				else if (el.value == "laptop")
				{
					model_selected = 3;
				}
				else if (el.value == "sofa")
				{
					model_selected = 4;
				}
			}


			function mouse_start(e)
			{
				mouse_last_x = e.offsetX;
				mouse_last_y = e.offsetY;
			}
			
			
			function mouse_move(e)
			{
				if (mouse_last_x != null)
				{
					var delta_x = e.offsetX - mouse_last_x; 
					var delta_y = e.offsetY - mouse_last_y;
					
					user_camera.increment_yaw(  -delta_x / 10);
					user_camera.increment_pitch(-delta_y / 10);
					
					mouse_last_x = e.offsetX;
					mouse_last_y = e.offsetY;
				}
			}


			function mouse_end(e)
			{
				mouse_last_x = null;
				mouse_last_y = null;
			}
			
			
			function _init_gl(canvas)
			{
				gl = canvas.getContext("webgl2", {preserveDrawingBuffer: true, antialias: false});					
				gl.enable(gl.CULL_FACE);
				gl.enable(gl.DEPTH_TEST);							
				gl.enable(gl.SCISSOR_TEST);
			}
			

			function _create_model_drawable(obj, albedo, metal, rough, scale)
			{
				var obj_verts =   [];
				var obj_uvs =     [];
				var obj_norms =   [];
				var obj_indices = [];
			
				var json_obj = resources[obj];
			
				var i = 0;
				while (i < json_obj.length)
				{
					// XYZs
					obj_verts.push(json_obj[i].v0.x);
					obj_verts.push(json_obj[i].v0.y);
					obj_verts.push(json_obj[i].v0.z);
					
					obj_verts.push(json_obj[i].v1.x);
					obj_verts.push(json_obj[i].v1.y);
					obj_verts.push(json_obj[i].v1.z);

					obj_verts.push(json_obj[i].v2.x);
					obj_verts.push(json_obj[i].v2.y);
					obj_verts.push(json_obj[i].v2.z);
					
					
					// UVs
					obj_uvs.push(json_obj[i].v0.u);
					obj_uvs.push(json_obj[i].v0.v);

					obj_uvs.push(json_obj[i].v1.u);
					obj_uvs.push(json_obj[i].v1.v);

					obj_uvs.push(json_obj[i].v2.u);
					obj_uvs.push(json_obj[i].v2.v);
					
					
					// NORMs
					obj_norms.push(json_obj[i].v0.nx);
					obj_norms.push(json_obj[i].v0.ny);
					obj_norms.push(json_obj[i].v0.nz);
					
					obj_norms.push(json_obj[i].v1.nx);
					obj_norms.push(json_obj[i].v1.ny);
					obj_norms.push(json_obj[i].v1.nz);
					
					obj_norms.push(json_obj[i].v2.nx);
					obj_norms.push(json_obj[i].v2.ny);
					obj_norms.push(json_obj[i].v2.nz);
					
					
					// INDEXes
					obj_indices.push(i*3+0);
					obj_indices.push(i*3+1);
					obj_indices.push(i*3+2);
					i += 1;
				}


				// OBJ Verts
				var obj_verts_vbo = gl.createBuffer();
				
				gl.bindBuffer(
					gl.ARRAY_BUFFER,
					obj_verts_vbo
				);

				gl.bufferData(
					gl.ARRAY_BUFFER,
					new Float32Array(obj_verts),
					gl.STATIC_DRAW
				);
				
				// OBJ UVs 
				var obj_uvs_vbo = gl.createBuffer();
				
				gl.bindBuffer(
					gl.ARRAY_BUFFER,
					obj_uvs_vbo
				);
				
				gl.bufferData(
					gl.ARRAY_BUFFER,
					new Float32Array(obj_uvs),
					gl.STATIC_DRAW
				);
				
				// OBJ NORMs 
				var obj_norms_vbo = gl.createBuffer();
				
				gl.bindBuffer(
					gl.ARRAY_BUFFER,
					obj_norms_vbo
				);
				
				gl.bufferData(
					gl.ARRAY_BUFFER,
					new Float32Array(obj_norms),
					gl.STATIC_DRAW
				);
				
				// OBJ INDEXes
				var obj_indices_vbo = gl.createBuffer();
					
				gl.bindBuffer(
					gl.ELEMENT_ARRAY_BUFFER,
					obj_indices_vbo
				);
				
				gl.bufferData(
					gl.ELEMENT_ARRAY_BUFFER,
					new Uint32Array(obj_indices),
					gl.STATIC_DRAW
				);

				// OBJ VAO
				var vao = gl.createVertexArray();
				gl.bindVertexArray(vao);

				gl.bindBuffer(gl.ARRAY_BUFFER, obj_verts_vbo);
				gl.enableVertexAttribArray(0);
				gl.vertexAttribPointer(
					0,
					3,
					gl.FLOAT,
					false,
					0,
					0				
				);
				
				gl.bindBuffer(gl.ARRAY_BUFFER, obj_uvs_vbo);
				gl.enableVertexAttribArray(1);
				gl.vertexAttribPointer(
					1,
					2,
					gl.FLOAT,
					false,
					0,
					0				
				);

				gl.bindBuffer(gl.ARRAY_BUFFER, obj_norms_vbo);
				gl.enableVertexAttribArray(2);
				gl.vertexAttribPointer(
					2,
					3,
					gl.FLOAT,
					false,
					0,
					0				
				);
				
				gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, obj_indices_vbo);
				
				// Unbind VAO attachment
				gl.bindVertexArray(null);


				var uniforms = {
					model: new Matrix4x4(),
					albedo: _make_2d_RGBA_UINT_texture_from_img(gl, resources[albedo], gl.LINEAR, gl.CLAMP_TO_EDGE),
					metal:  _make_2d_RGBA_UINT_texture_from_img(gl, resources[metal],  gl.LINEAR, gl.CLAMP_TO_EDGE),
					rough:  _make_2d_RGBA_UINT_texture_from_img(gl, resources[rough],  gl.LINEAR, gl.CLAMP_TO_EDGE),
				};
				uniforms.model.set_scale(scale, scale, scale);
				uniforms.model.set_translate(0.0, -0.5, 0.0);
				

				return new Drawable(uniforms, vao, gl.TRIANGLES, obj_indices.length, true);
			}
			
			
			function draw_scene()
			{
				// Choose a background color
				var background_color = new RGBA(0.05, 0.05, 0.25, 1);

				var q = parseFloat( document.getElementById("light_height").value );
				var light_pos = [-2.0, q, 3.0];

				
				var camera_pos = user_camera.view_matrix().inverse().mult_vec4([0.0, 0.0, 0.0, 1.0]);
			
				cook_torrance_brdf.draw(null, 		// <-- 'null' references the default Framebuffer in WebGL
								   
								   user_camera.proj_matrix(), 
								   user_camera.view_matrix(), 

								   light_pos,
								   camera_pos,

								   [ drawables[model_selected] ], 
								   background_color);


				// Redraw the screen
				window.requestAnimationFrame(draw_scene);				
			}
			
			
			function initialize_demo()
			{
				var frame_canvas = document.getElementById("frame_canvas");
				frame_canvas.addEventListener("mousedown", mouse_start);
				frame_canvas.addEventListener("mousemove", mouse_move);
				frame_canvas.addEventListener("mouseleave", mouse_end);
				frame_canvas.addEventListener("mouseup", mouse_end);

				var input_option = document.getElementById("model_chosen");
				input_option.addEventListener("change", update_selection);


				// LOCAL state (View)
				update_selection();
				user_camera = new Orbit_Camera(60.0, 60.0, 0.1, 100.0, // fov_lr, fov_td, near, far
											   2.5, 30.0, -20.0);	  // orbit_distance, yaw, roll





				// LOCAL state (GL)
				_init_gl(frame_canvas);				
				drawables.push( _create_model_drawable("cabinet_obj", "cabinet_albedo", "cabinet_metal", "cabinet_rough", 1) );
				drawables.push( _create_model_drawable("food_obj", 	  "food_albedo",    "food_metal",    "food_rough",    5) );
				drawables.push( _create_model_drawable("jug_obj",     "jug_albedo",     "jug_metal",     "jug_rough",     5) );
				drawables.push( _create_model_drawable("laptop_obj",  "laptop_albedo",  "laptop_metal",  "laptop_rough", 2.5) );
				drawables.push( _create_model_drawable("sofa_obj",    "sofa_albedo",     "sofa_metal",   "sofa_rough", 1.5) );

							
				
				// Effect is half the screen size so it can be used on the right half of the screen only
				cook_torrance_brdf = new Cook_Torrance_BRDF(gl, frame_canvas.width, frame_canvas.height);
								
				window.requestAnimationFrame(draw_scene);
			}
			
			
			function load_resources()
			{	
				// Load the Engine resources
				var demo_resource_list = [
					["cabinet_obj",		"/assets/objs/cabinet.json",			"json"],
					["cabinet_albedo",	"/assets/textures/cabinet_diff.jpg",	"img" ],
					["cabinet_metal",	"/assets/textures/cabinet_metal.png",	"img" ],
					["cabinet_rough",	"/assets/textures/cabinet_rough.png",	"img" ],

					["food_obj",		"/assets/objs/food.json",				"json"],
					["food_albedo",		"/assets/textures/food_diff.jpg",		"img" ],
					["food_metal",		"/assets/textures/food_metal.png",		"img" ],
					["food_rough",		"/assets/textures/food_rough.png",		"img" ],

					["jug_obj",			"/assets/objs/jug.json",				"json"],
					["jug_albedo",		"/assets/textures/jug_diff.jpg",		"img" ],
					["jug_metal",		"/assets/textures/jug_metal.png",		"img" ],
					["jug_rough",		"/assets/textures/jug_rough.png",		"img" ],
					
					["laptop_obj",		"/assets/objs/laptop.json",				"json"],
					["laptop_albedo",	"/assets/textures/laptop_diff.jpg",		"img" ],
					["laptop_metal",	"/assets/textures/laptop_metal.png",	"img" ],
					["laptop_rough",	"/assets/textures/laptop_rough.png",	"img" ],

					["sofa_obj",		"/assets/objs/sofa.json",				"json"],
					["sofa_albedo",		"/assets/textures/sofa_diff.jpg",		"img" ],
					["sofa_metal",		"/assets/textures/sofa_metal.png",		"img" ],
					["sofa_rough",		"/assets/textures/sofa_rough.png",		"img" ],
				];
				
				
				var effect_resource_list = Cook_Torrance_BRDF.external_resources();
				for (var i = 0; i < effect_resource_list.length; i++)
				{
					demo_resource_list.push( effect_resource_list[i] );
				}
				
				var all_resources_dict = {
					demo:		demo_resource_list,
				};
				

				load_external_resources(all_resources_dict, function (resource_sets)
				{
					resources = resource_sets['demo'];
					initialize_demo();
				});
			}
			
		</script>
		
	</head>	

	<body onload="load_resources()">
		<h1>Demo: Cook-Torrance BRDF</h1>	
		<p>
			Name: Dane Christensen</br>
			Date: 8/4/2026
		</p>
		<table>
			<tr>
				<td>
					<canvas	id="frame_canvas"
							style="background-color: #FFFFFF;" 
							width=1024 
							height=1024>
					</canvas>	
				</td>
			</tr>
			<tr style="text-align:center">
				<td colspan="2">
					<br/>
					<input style="width:512px;" type="range" id="light_height" value=1.4 min=0 max=16 step=0.1>
					<br/>
					Light Source Height
				</td>
			</tr>
		</table>
		Model Selected:
		<select id="model_chosen">
			<option value="cabinet">cabinet</option>
			<option value="food">food</option>
			<option value="jug">jug</option>
			<option value="laptop">laptop</option>
			<option value="sofa">sofa</option>
		</select>

			<br/>
			<br/>
			
		</p>
	</body>
</html>
