			class Matrix4x4
			{
				constructor()
				{
					this.data = new Float32Array(16);
					this.set_identity();
				}
				
				copy()
				{
					var rv = new Matrix4x4();
					
					for (var r = 0; r < 4; r++)
					{
						for (var c = 0; c < 4; c++)
						{
							rv.set(r, c, this.get(r, c));
						}
					}
					
					return rv;
				}

				set(r, c, value)
				{
					this.data[(c * 4) + r] = value;
				}

				get(r, c)
				{
					return this.data[(c * 4) + r];
				}

				zero()
				{
					for (var r = 0; r < 4; r++)
					{
						for (var c = 0; c < 4; c++)
						{
							this.set(r, c, 0);
						}
					}
				}

				_swap(r_a, c_a, r_b, c_b)
				{
					var tmp = this.get(r_a, c_a);
					this.set(r_a, c_a, this.get(r_b, c_b));
					this.set(r_b, c_b, tmp);
				}

				transpose()
				{
					var rv = this.copy();
					rv._swap(0, 1, 1, 0);
					rv._swap(0, 2, 2, 0);
					rv._swap(0, 3, 3, 0);

					rv._swap(1, 2, 2, 1);
					rv._swap(1, 3, 3, 1);

					rv._swap(2, 3, 3, 2);
					
					return rv;
				}

				set_identity()
				{
					this.zero();
					for (var i = 0; i < 4; i++)
					{
						this.set(i, i, 1.0);
					}
				}

				set_scale(x, y, z)
				{
					this.set(0, 0, x);
					this.set(1, 1, y);
					this.set(2, 2, z);
				}

				set_translate(x, y, z)
				{
					this.set(0, 3, x);
					this.set(1, 3, y);
					this.set(2, 3, z);
				}

				set_rotate(axis='x', rot_deg)
				{
					if (axis != 'x' && axis != 'y' && axis != 'z')
					{
						alert('Bad rotation matrix around axis ' + axis );
						return;
					}

					var rad = Math.PI * rot_deg / 180.0;
					var cos_t = Math.cos(rad);
					var sin_t = Math.sin(rad);

					if (axis == 'x')
					{
						this.set(0, 0, 1.0);
						this.set(0, 1, 0.0);
						this.set(0, 2, 0.0);
						this.set(0, 3, 0.0);

						this.set(1, 0, 0.0);
						this.set(1, 1, cos_t);
						this.set(1, 2, sin_t);
						this.set(1, 3, 0.0);

						this.set(2, 0, 0.0);
						this.set(2, 1, -sin_t);
						this.set(2, 2, cos_t);
						this.set(2, 3, 0.0);

						this.set(3, 0, 0.0);
						this.set(3, 1, 0.0);
						this.set(3, 2, 0.0);
						this.set(3, 3, 1.0);
					}
					else if (axis == 'y')
					{
						this.set(0, 0, cos_t);
						this.set(0, 1, 0.0);
						this.set(0, 2, -sin_t);
						this.set(0, 3, 0.0);

						this.set(1, 0, 0.0);
						this.set(1, 1, 1.0);
						this.set(1, 2, 0.0);
						this.set(1, 3, 0.0);

						this.set(2, 0, sin_t);
						this.set(2, 1, 0.0);
						this.set(2, 2, cos_t);
						this.set(2, 3, 0.0);

						this.set(3, 0, 0.0);
						this.set(3, 1, 0.0);
						this.set(3, 2, 0.0);
						this.set(3, 3, 1.0);

					}
					else if (axis == 'z')
					{
						this.set(0, 0, cos_t);
						this.set(0, 1, -sin_t);
						this.set(0, 2, 0.0);
						this.set(0, 3, 0.0);

						this.set(1, 0, sin_t);
						this.set(1, 1, cos_t);
						this.set(1, 2, 0.0);
						this.set(1, 3, 0.0);

						this.set(2, 0, 0.0);
						this.set(2, 1, 0.0);
						this.set(2, 2, 1.0);
						this.set(2, 3, 0.0);

						this.set(3, 0, 0.0);
						this.set(3, 1, 0.0);
						this.set(3, 2, 0.0);
						this.set(3, 3, 1.0);
					}
				}
				
				set_perspective(fov_lr_deg, fov_td_deg, near, far)
				{
					// We are looking for the Left-handed coordinate versions of these
					near = -near;
					far  = -far;
					
					var fov_lr_rad = fov_lr_deg * Math.PI / 180.0;
					var fov_td_rad = fov_td_deg * Math.PI / 180.0;

					var left = near * Math.tan(fov_lr_rad / 2.0);
					var right = -left;
					var bot = near * Math.tan(fov_td_rad / 2.0);
					var top = -bot;

					this.set(0, 0, -2.0 * near / (right - left));
					this.set(0, 1, 0.0);
					this.set(0, 2, (right + left) / (right - left));
					this.set(0, 3, 0.0);

					this.set(1, 0, 0.0);
					this.set(1, 1, -2.0 * near / (top - bot));
					this.set(1, 2, (top + bot) / (top - bot));
					this.set(1, 3, 0.0);

					this.set(2, 0, 0.0);
					this.set(2, 1, 0.0);
					this.set(2, 2, -(far + near) / (far - near));
					this.set(2, 3, (2.0 * far * near) / (far - near));

					this.set(3, 0,  0.0);
					this.set(3, 1,  0.0);
					this.set(3, 2, -1.0);
					this.set(3, 3,  0.0);
				}
				
				set_orthographic(left, right, bot, top, near, far)
				{
					// We are looking for the Left-handed coordinate versions of these
					near = -near;
					far = -far;
					
					this.set(0, 0, 2.0 / (right - left));
					this.set(0, 1, 0.0);
					this.set(0, 2, 0.0);
					this.set(0, 3, -(left + right) / (right - left));

					this.set(1, 0, 0.0);
					this.set(1, 1, 2.0 / (top - bot));
					this.set(1, 2, 0.0);
					this.set(1, 3, -(bot + top) / (top - bot));

					this.set(2, 0, 0.0);
					this.set(2, 1, 0.0);
					this.set(2, 2, 2.0 / (far - near));
					this.set(2, 3, -(near + far) / (far - near));

					this.set(3, 0,  0.0);
					this.set(3, 1,  0.0);
					this.set(3, 2,  0.0);
					this.set(3, 3,  1.0);
				}

				set_columns_basis_r3(col_right, col_up, col_forward)
				{
					this.set_identity();

					this.set(0, 0, col_right[0]);
					this.set(1, 0, col_right[1]);
					this.set(2, 0, col_right[2]);

					this.set(0, 1, col_up[0]);
					this.set(1, 1, col_up[1]);
					this.set(2, 1, col_up[2]);

					this.set(0, 2, col_forward[0]);
					this.set(1, 2, col_forward[1]);
					this.set(2, 2, col_forward[2]);
				}

				mult(other_mat)
				{
					var rv = new Matrix4x4();

					for (var r = 0; r < 4; r++)
					{
						for (var c = 0; c < 4; c++) 
						{
							var sum = 0;                      
							for (var i = 0; i < 4; i++)
							{
								sum = sum + (this.get(r, i) * other_mat.get(i, c));
							}

							rv.set(r, c, sum);
						}
					}

					return rv;              
				}
				
				mult_vec4(vec4)
				{
					if (vec4.length != 4)
					{
						alert('Invalid vec4');
						console.log('Invalid vec4');
						return null;
					}
					
					var rv = [
								this.get(0,0)*vec4[0] + this.get(0,1)*vec4[1] + this.get(0,2)*vec4[2] + this.get(0,3)*vec4[3],
								this.get(1,0)*vec4[0] + this.get(1,1)*vec4[1] + this.get(1,2)*vec4[2] + this.get(1,3)*vec4[3],
								this.get(2,0)*vec4[0] + this.get(2,1)*vec4[1] + this.get(2,2)*vec4[2] + this.get(2,3)*vec4[3],
								this.get(3,0)*vec4[0] + this.get(3,1)*vec4[1] + this.get(3,2)*vec4[2] + this.get(3,3)*vec4[3]					
							];
					
					return rv;		
				}
				
				add(other_mat)
				{
					var rv = this.copy();
					
					for (var r = 0; r < 4; r++)
					{
						for (var c = 0; c < 4; c++)
						{
							rv.set(r, c, rv.get(r,c) + other_mat.get(r,c));
						}
					}
					
					return rv;
				}

				sub(other_mat)
				{
					var rv = this.copy();
					
					for (var r = 0; r < 4; r++)
					{
						for (var c = 0; c < 4; c++)
						{
							rv.set(r, c, rv.get(r,c) - other_mat.get(r,c));
						}
					}
					
					return rv;
				}
				
				_det(r, c)
				{
					if (r.length < 2)
					{
						alert('Invalid call to _det');
						console.log('Invalid call to _det');
						return null;
					}
					else if (r.length == 2)
					{
						return this.get(r[0],c[0])*this.get(r[1],c[1]) - this.get(r[0],c[1])*this.get(r[1],c[0]);
					}
					
					var sum = 0;
					for (var i = 0; i < r.length; i++)
					{
						var tmp_r = structuredClone(r);
						tmp_r.splice(0,1);
						var tmp_c = structuredClone(c);
						tmp_c.splice(i,1);
									
						var sign = (0 + i) % 2 == 0 ? 1.0 : -1.0;
						sum = sum + ( sign * this.get(r[0],c[i]) * this._det(tmp_r, tmp_c) );
					}
						
					return sum;
				}
				
				det()
				{
					var r = [0,1,2,3];
					var c = [0,1,2,3];
					var det = this._det(r, c);
					return det;
				}
				
				inverse()
				{
					var r = [0,1,2,3];
					var c = [0,1,2,3];
					var det = this._det(r, c);
					if (det == 0.0)
					{
						alert('Invalid Matrix4x4 inversion: matrix cannot be inverted!');
						console.log('Invalid Matrix4x4 inversion: matrix cannot be inverted!');
						return null;
					}
					var coef = 1.0 / det;
						
					var adj = new Matrix4x4();
					for (var r_i = 0; r_i < 4; r_i++)
					{
						for (var c_i = 0; c_i < 4; c_i++)
						{
							var tmp_r = structuredClone(r);
							tmp_r.splice(r_i,1);
							var tmp_c = structuredClone(c);
							tmp_c.splice(c_i,1);
										
							var sign = (r_i + c_i) % 2 == 0 ? 1.0 : -1.0;
							adj.set(c_i, r_i, sign * coef * this._det(tmp_r, tmp_c)); 
						}
					}
					
					return adj;	
				}
			}

			function tangent_bitangent_calc(p1, p2, p3, uv1, uv2, uv3)
			{
				var u1  = uv2[0] - uv1[0];
				var v1  = uv2[1] - uv1[1];
				
				var u2  = uv3[0] - uv2[0];
				var v2  = uv3[1] - uv2[1];
				
				var e1x = p2[0] - p1[0];
				var e1y = p2[1] - p1[1];
				var e1z = p2[2] - p1[2];
				
				var e2x = p3[0] - p2[0];
				var e2y = p3[1] - p2[1];
				var e2z = p3[2] - p2[2];
				
				var e3x = p1[0] - p3[0];
				var e3y = p1[1] - p3[1];
				var e3z = p1[2] - p3[2];
			
				var tmp = 1.0 / (u1 * v2 - v1 * u2);
				
				var T = [	tmp * (v2 * e1x - v1 * e2x),
							tmp * (v2 * e1y - v1 * e2y),
							tmp * (v2 * e1z - v1 * e2z),
						];
						
				var B = [	tmp * (-u2 * e1x + u1 * e2x),
							tmp * (-u2 * e1y + u1 * e2y),
							tmp * (-u2 * e1z + u1 * e2z),
						];
			
				return {
					T_vec: T,
					B_vec: B
				};
			}

								layout(location=4) in vec3 aNormal;

								uniform global_data
								{
									mat4 proj;
									mat4 view;
									mat4 model;
								};


								smooth out vec2 interp_uv;
								smooth out vec3 interp_pos;
								smooth out mat3 mat_tbn;
								
								void main(){

									
									vec4 tmp = model * aPos;
									
									interp_uv = aUV;
									interp_pos = tmp.xyz;
									
									mat_tbn = mat3(normalize(aTangent),
												   normalize(aBitangent),
												   normalize(aNormal));
									
									gl_Position = proj * view * tmp;								
								}`;
				
				
				var vertex_shader = gl.createShader(gl.VERTEX_SHADER);
				gl.shaderSource(vertex_shader, vs_code);
				gl.compileShader(vertex_shader);
				if (!gl.getShaderParameter(vertex_shader, gl.COMPILE_STATUS))
				{
					alert('Failed to compile vertex shader:' + gl.getShaderInfoLog(vertex_shader));
					return;
				}


				var fs_code = `#version 300 es
								precision highp float;

								uniform sampler2D texture0;
								uniform sampler2D texture1;


								uniform global_data
								{
									mat4 proj;
									mat4 view;
									mat4 model;
								};
								
								smooth in vec2 interp_uv;
								smooth in vec3 interp_pos;
								smooth in mat3 mat_tbn;
								
								out vec4 outCol;
								
								void main() {
								
									vec3 light_source = vec3(0.0, 2.5, 0.2);
								
									vec4 norm_vec   = model * vec4(mat_tbn * (texture(texture0, interp_uv).xyz), 0.0);									
									vec3 norm_color = norm_vec.xyz;
									vec3 diff_color = texture(texture1, interp_uv).xyz;

	
									norm_color.x = 2.0 * norm_color.x - 1.0;
									norm_color.y = 2.0 * norm_color.y - 1.0;
									norm_color.z = 2.0 * norm_color.z - 1.0;
	
									norm_color = normalize( norm_color );
									vec3 light_dir = normalize(light_source - interp_pos);
									
									
									
									float c = max(0.0, dot(light_dir, norm_color));
									
									
									outCol = vec4(c*1.0, 0.0, 0.0, 1.0);
									
								}`;
								
				var fragment_shader = gl.createShader(gl.FRAGMENT_SHADER);
				gl.shaderSource(fragment_shader, fs_code);
				gl.compileShader(fragment_shader);
				if (!gl.getShaderParameter(fragment_shader, gl.COMPILE_STATUS))
				{
					alert('Failed to compile fragment shader:' + gl.getShaderInfoLog(fragment_shader));
					return;
				}
						
				
				program = gl.createProgram();
				gl.attachShader(program, vertex_shader);
				gl.attachShader(program, fragment_shader);
				gl.linkProgram(program);
				
				if (!gl.getProgramParameter(program, gl.LINK_STATUS))
				{
					alert('Failed to link shader program:' + gl.getProgramInfoLog(program));
					return;
				}
				
				
				ubo = gl.createBuffer();
				gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
			

		
				
				var block_index = gl.getUniformBlockIndex(program, "global_data");
		
				var block_size = gl.getActiveUniformBlockParameter(program,
																   block_index,
																   gl.UNIFORM_BLOCK_DATA_SIZE);
				gl.bufferData(gl.UNIFORM_BUFFER, block_size, gl.DYNAMIC_DRAW);

				gl.bindBufferBase(gl.UNIFORM_BUFFER, 0, ubo);
				gl.uniformBlockBinding(program, block_index, 0);

				
				var ubo_names = ["proj", "view", "model"];
				var ubo_indices = gl.getUniformIndices(program,
													   ubo_names);
				var ubo_offsets = gl.getActiveUniforms(program,
													   ubo_indices,
													   gl.UNIFORM_OFFSET);
				proj_mat_loc  = ubo_offsets[0];
				view_mat_loc  = ubo_offsets[1];
				model_mat_loc = ubo_offsets[2];
				texture0_loc  = gl.getUniformLocation(program, "texture0");
				texture1_loc  = gl.getUniformLocation(program, "texture1");
				
				
				update_model();
				update_pitch();
				
				model_mat = new Matrix4x4();
				view_mat = new Matrix4x4();
				proj_mat = new Matrix4x4();				
				
				update_pitch();
				
				draw_gl_canvas();
			}
		</script>
